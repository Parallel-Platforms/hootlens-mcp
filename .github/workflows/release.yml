name: Prepare or publish public MCP release
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a new version after the public source and npm trusted publisher are reviewed
        type: boolean
        default: false
      version:
        description: Exact version confirmation, required only for publication
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: public-mcp-release
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.repository == 'Parallel-Platforms/hootlens-mcp'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run release:prepare
      - run: npm run release:pack
  publish:
    needs: prepare
    if: inputs.publish == true && startsWith(github.ref, 'refs/tags/mcp-v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install -g npm@^11.5.1
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run release:prepare
      - run: npm run release:pack
      - run: npm run release:verify-publish
      # Build and publish inside this public checkout. Do not substitute a private-built artifact.
      - run: npm publish ./.release/package --provenance --access public --ignore-scripts
